<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#252526">
    <meta name="description" content="Add borders to images privately in your browser.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>InstaBorder - Image Border Editor</title>
    <link rel="stylesheet" href="style.css">
    <!-- GeoTIFF library for TIFF file support -->
    <script src="https://unpkg.com/geotiff@2.0.7/dist-browser/geotiff.js"></script>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="image-container" id="imageContainer">
                <div class="blur-background" id="blurBackground"></div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">🖼️</div>
                    <div class="upload-text">Click to upload an image</div>
                    <div class="upload-subtext">or drag and drop here</div>
                </div>
                <img id="displayImage" class="display-image initially-hidden" />
            </div>
            <div class="image-info initially-hidden" id="imageInfo"></div>
            <div class="dimensions-info initially-hidden" id="dimensionsInfo"></div>
        </div>

        <div class="sidebar">
            <h2>Controls</h2>
            
            <div class="control-group">
                <input type="file" id="fileInput" accept="image/*,.tif,.tiff" class="hidden-input">
                <button id="chooseFileButton">Choose File</button>
                <button class="secondary" id="clearImageButton">Clear Image</button>
                <button id="exportImageButton">Export Image</button>
            </div>

            <h2>Export Settings</h2>
            
            <div class="control-group">
                <div class="toggle-container">
                    <label>Limit File Size</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="limitFileSize">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <label>Max Size (MB):</label>
                <input type="number" id="maxFileSizeMB" min="0.1" max="50" value="1" step="0.1" disabled>
            </div>

            <h2>Border Controls</h2>
            
            <div class="control-group">
                <label>Width: <span class="range-value" id="borderWidthValue">50</span>%</label>
                <input type="range" id="borderWidth" min="0" max="100" value="50">
            </div>
            
            <div class="control-group">
                <label>Background Color:</label>
                <select id="backgroundType">
                    <option value="#ffffff">White</option>
                    <option value="#000000">Black</option>
                    <option value="blur">Blur Background</option>
                    <option value="custom">Custom Color</option>
                </select>
                <input type="color" id="customBackgroundColor" class="custom-background-color" value="#ffffff">
            </div>
            
            <div class="control-group">
                <label>Aspect Ratio (W:H):</label>
                <select id="aspectRatio">
                    <option value="4:5" selected>4:5 (Instagram)</option>
                    <option value="5:4">5:4 (Instagram)</option>
                    <option value="1.91:1">1.91:1 (Instagram)</option>
                    <option value="1:1">1:1 (Square)</option>
                    <option value="original">Original</option>
                    <option value="3:2">3:2</option>
                    <option value="4:3">4:3</option>
                    <option value="16:9">16:9</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            
            <div class="control-group initially-hidden" id="customAspectGroup">
                <label>Custom Ratio:</label>
                <div class="custom-ratio-controls">
                    <input type="number" id="customRatioX" class="custom-ratio-input" min="0.1" step="0.1" value="1">
                    <span>:</span>
                    <input type="number" id="customRatioY" class="custom-ratio-input" min="0.1" step="0.1" value="1">
                    <button type="button" id="applyAspectRatioButton" class="apply-aspect-ratio-button">Apply</button>
                </div>
            </div>
            
        </div>


    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .catch(error => console.error('Service worker registration failed:', error));
            });
        }
    </script>
</body>
</html>
